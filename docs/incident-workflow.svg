<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">IT incident tracking workflow</title>
  <desc id="description">A workflow showing a user submitting an incident, a technician claiming and updating it, a manager reviewing it, and the user viewing the final status. All actions are stored in MySQL activity history.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#17324d"/>
      <stop offset="1" stop-color="#246b8f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#246b8f"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 16px Arial, sans-serif; fill: #d7edf7; }
      .box-title { font: 700 19px Arial, sans-serif; fill: #17324d; }
      .body { font: 15px Arial, sans-serif; fill: #263746; }
      .status { font: 700 15px Arial, sans-serif; fill: #ffffff; }
      .small { font: 14px Arial, sans-serif; fill: #526576; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f3f7fa"/>
  <rect width="1200" height="115" fill="url(#header)"/>
  <text x="55" y="52" class="title">IT Incident Tracking System</text>
  <text x="55" y="84" class="subtitle">Role-based incident handling from submission to resolution</text>

  <g filter="url(#shadow)">
    <rect x="55" y="165" width="235" height="170" rx="14" fill="#ffffff" stroke="#8fc8df" stroke-width="2"/>
    <rect x="55" y="165" width="235" height="45" rx="14" fill="#d9f1fb"/>
    <text x="78" y="194" class="box-title">1. USER</text>
    <text x="78" y="244" class="body">Register or sign in</text>
    <text x="78" y="270" class="body">Submit issue details</text>
    <text x="78" y="296" class="body">Receive TKN-... token</text>
    <text x="78" y="322" class="body">Track updates and ETA</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="165" width="235" height="170" rx="14" fill="#ffffff" stroke="#8fc8df" stroke-width="2"/>
    <rect x="350" y="165" width="235" height="45" rx="14" fill="#d9f1fb"/>
    <text x="373" y="194" class="box-title">2. TECHNICIAN</text>
    <text x="373" y="244" class="body">View issue-type queue</text>
    <text x="373" y="270" class="body">Claim an open ticket</text>
    <text x="373" y="296" class="body">Set progress or waiting</text>
    <text x="373" y="322" class="body">Request manager review</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="645" y="165" width="235" height="170" rx="14" fill="#ffffff" stroke="#8fc8df" stroke-width="2"/>
    <rect x="645" y="165" width="235" height="45" rx="14" fill="#d9f1fb"/>
    <text x="668" y="194" class="box-title">3. MANAGER</text>
    <text x="668" y="244" class="body">Review unresolved tickets</text>
    <text x="668" y="270" class="body">Reassign when needed</text>
    <text x="668" y="296" class="body">Return or approve work</text>
    <text x="668" y="322" class="body">Approve Resolved status</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="165" width="205" height="170" rx="14" fill="#ffffff" stroke="#8fc8df" stroke-width="2"/>
    <rect x="940" y="165" width="205" height="45" rx="14" fill="#d9f1fb"/>
    <text x="963" y="194" class="box-title">4. CLOSED LOOP</text>
    <text x="963" y="244" class="body">User sees status</text>
    <text x="963" y="270" class="body">and update history</text>
    <text x="963" y="296" class="body">All roles see</text>
    <text x="963" y="322" class="body">role-specific history</text>
  </g>

  <path d="M290 250 H345" stroke="#246b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M585 250 H640" stroke="#246b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M880 250 H935" stroke="#246b8f" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="120" y="410" width="960" height="190" rx="18" fill="#ffffff" stroke="#b5c8d4" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="450" class="box-title">Ticket status path</text>
  <rect x="155" y="485" width="125" height="38" rx="19" fill="#607d8b"/>
  <text x="217" y="510" text-anchor="middle" class="status">Open</text>
  <path d="M280 504 H320" stroke="#246b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="330" y="485" width="135" height="38" rx="19" fill="#4285a4"/>
  <text x="397" y="510" text-anchor="middle" class="status">Allocated</text>
  <path d="M465 504 H505" stroke="#246b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="515" y="485" width="145" height="38" rx="19" fill="#307c9e"/>
  <text x="587" y="510" text-anchor="middle" class="status">In Progress</text>
  <path d="M660 504 H700" stroke="#246b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="710" y="485" width="200" height="38" rx="19" fill="#246b8f"/>
  <text x="810" y="510" text-anchor="middle" class="status">Pending Manager Review</text>
  <path d="M910 504 H950" stroke="#246b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="960" y="485" width="90" height="38" rx="19" fill="#2d8a61"/>
  <text x="1005" y="510" text-anchor="middle" class="status">Resolved</text>
  <text x="155" y="565" class="small">Waiting is available when work is blocked; managers can return unresolved tickets to an earlier state.</text>

  <rect x="275" y="635" width="650" height="46" rx="23" fill="#17324d"/>
  <text x="600" y="664" text-anchor="middle" class="status">MySQL: tickets + updates + user / technician / manager activity logs</text>
</svg>
