# ==============================================================================
# Database Configuration for IT Incident Tracking System
# This configuration matches your MySQL Workbench connection settings.
# ==============================================================================

# JDBC connection URL to MySQL Server
db.url=jdbc:mysql://localhost:3306/incident_tracking?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false

# Default credentials configured in incident_tracking_workbench_setup.sql:
db.user=incident_user
db.password=Incident@123

# Alternatively, if you prefer connecting with your MySQL root account:
# db.user=root
# db.password=your_root_password

# Optional: Dedicated credentials for each role if using strict role separation
# db.auth.user=incident_auth
# db.auth.password=
# db.user.user=incident_user
# db.user.password=
# db.technician.user=incident_technician
# db.technician.password=
